<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网页图形运行时模拟器</title>
  <style>
    html, body { inline-size: 100%; block-size: 100%; margin: 0; overflow: hidden; color: #e0f2fe; font: 15px/1.5 system-ui, sans-serif; background: radial-gradient(circle at 50% 0, #155e75, #082f49 45%, #020617); }
    main { display: grid; min-block-size: 100%; place-items: center; padding: 20px; }
    section { inline-size: min(620px, 100%); padding: 28px; text-align: center; background: rgb(8 47 73 / 72%); border: 1px solid rgb(125 211 252 / 50%); border-radius: 12px; }
    button { inline-size: 94px; block-size: 94px; margin: 22px auto; cursor: pointer; background: linear-gradient(135deg, #7dd3fc, #0e7490); border: 0; border-radius: 12px; transform: rotate(15deg); transition: transform .2s; }
    button:hover { transform: rotate(25deg) scale(1.08); }
    #message { min-block-size: 48px; padding: 10px; background: rgb(2 6 23 / 45%); border-radius: 5px; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>网页图形运行时模拟器</h1>
      <button id="object-button" aria-label="模拟三维对象"></button>
      <button id="stale-object-button" aria-label="模拟旧燃气三维对象"></button>
      <button id="delayed-object-button" aria-label="安排延迟燃气三维对象"></button>
      <p>点击方块会回传稳定业务节点标识。</p>
      <p>后两枚方块只用于任务-037的旧实例与释放后迟到事件回归。</p>
      <!--
        本地回归计数仅记录 focusNode（聚焦节点）命令次数，不记录节点标识、场景或任何业务载荷。
        它用于验证二维重复点击不会重复向 Unity 下发聚焦；正式 WebGL 页面不依赖该测试属性。
      -->
      <p
        id="message"
        data-focus-node-count="0"
        data-node-visual-state-command-count="0"
        data-node-visual-state-failure-count="0"
        data-clear-node-visual-state-command-count="0"
        data-last-node-visual-state=""
        data-active-node-visual-state-count="0"
      >正在初始化桥接。</p>
    </section>
  </main>

  <script>
    /**
     * 模拟 Unity .jslib：在注册监听器后发送完整 ready，严格校验父窗口命令，
     * 并对 init、resize、dispose 使用原始 messageId 作为 requestId 回执。
     */
    const channel = 'power3d-unity';
    // 与正式内层协议第二版保持一致，确保命名镜头和关键环节命令走真实版本门禁。
    const version = 2;
    const query = new URLSearchParams(window.location.search);
    const parentOrigin = query.get('parentOrigin');
    const instanceId = query.get('instanceId');
    const runtimeKey = query.get('runtimeKey');
    const buildId = query.get('buildId');
    const sceneMappingVersion = query.get('sceneMappingVersion');
    const resourceDigest = query.get('resourceDigest');
    // 以下四项只由任务-014本地夹具入口传入，用于稳定复现“快速取代、外层超时、失败恢复”。
    // 生产 Unity 构建不读取这些参数；未提供或不匹配场景时仍使用默认 40 毫秒成功完成路径。
    const fastDelaySceneId = query.get('fastDelaySceneId');
    const fastSceneDelayMs = Number(query.get('fastSceneDelayMs')) || 40;
    const timeoutDelaySceneId = query.get('timeoutDelaySceneId');
    const timeoutSceneDelayMs = Number(query.get('timeoutSceneDelayMs')) || 40;
    const failedSceneId = query.get('failedSceneId');
    // 仅由任务-014夹具注入的四态失败开关。生产网页图形不传递此参数，因此不能借它伪造真实模型失败。
    const failedNodeVisualState = query.get('failNodeVisualState');
    // 本地夹具与正式内层协议同步声明全部受控动作；模拟页只回传结构化结果，
    // 不伪造任何场景节点、材质或路径资源，从而不会把夹具误当成九场景业务实现。
    const commandCapabilities = ['init', 'resize', 'switchScene', 'enterProcessStep', 'moveCameraToPose', 'enterProcessDetail', 'prepareProcessDetail', 'commitProcessDetail', 'abortProcessDetail', 'exitProcessDetail', 'setProcessDetailPlayback', 'resetScene', 'focusNode', 'clearSelection', 'setNodeVisualState', 'clearNodeVisualState', 'setRouteFlow', 'setNodeVisibility', 'dispose'];
    const eventCapabilities = ['ready', 'ack', 'commandResult', 'sceneLoadProgress', 'sceneChanged', 'objectSelected', 'selectionCleared', 'disposed'];
    const message = document.querySelector('#message');
    let disposed = false;
    // 模拟 Unity 每次实际完成场景加载时的新物理实例；同场景普通命令不会改变该值。
    let sceneActivationSequence = 0;
    let activeSceneId = '';
    let activeSceneActivationId = '';
    // 每个场景最多保留最近一次被替换的物理实例，共九个场景上限；它只为 ABA（同值往返）浏览器回归生成过期事件。
    const previousSceneActivationIdBySceneId = new Map();
    // 延迟选择最多允许一个待发计时器。释放时会统一取消，避免本地夹具保留计时器或在已释放会话中继续发送事件。
    const delayedObjectSelectionTimers = new Set();
    // 一秒延迟为浏览器完成跨 iframe 释放命令预留足够余量；它仅服务本地回归，不属于生产超时或重试策略。
    const delayedObjectSelectionDelayMs = 1_000;
    // 本地夹具仅保存当前动态覆盖的受控摘要：键为已校验 sceneNodeId，容量与正式运行时一致限制为500项。
    // 它不模拟材质、层级、对象引用或正式燃气模型；内置浏览器只据此确认命令确实穿过三层链路抵达模拟端。
    const activeVisualStateBySceneNodeId = new Map();

    /** 将本地夹具的有限状态摘要写入固定 data 属性，供浏览器测试读取，正式 WebGL 构建不会包含该元素。 */
    function refreshVisualStateDiagnostics() {
      message.dataset.activeNodeVisualStateCount = String(activeVisualStateBySceneNodeId.size);
    }

    /** 仅记录固定九场景目录内最近被替换的实例，避免测试输入异常时把历史标识无限保留。 */
    function rememberPreviousSceneActivation(sceneId, sceneActivationId) {
      previousSceneActivationIdBySceneId.delete(sceneId);
      previousSceneActivationIdBySceneId.set(sceneId, sceneActivationId);
      while (previousSceneActivationIdBySceneId.size > 9) {
        previousSceneActivationIdBySceneId.delete(previousSceneActivationIdBySceneId.keys().next().value);
      }
    }

    /** 释放测试页时取消所有尚未触发的选择回调，确保已释放会话绝不会从计时器路径继续发送内层事件。 */
    function clearDelayedObjectSelectionTimers() {
      for (const timerId of delayedObjectSelectionTimers) window.clearTimeout(timerId);
      delayedObjectSelectionTimers.clear();
    }

    /**
     * 夹具只允许燃气场景的已登记三维节点生成对象选择事件。
     * 它刻意不根据对象名称、场景路径或上一次按钮状态推导载荷，防止测试页绕过正式映射边界。
     */
    function createGasObjectSelectionPayload(sceneActivationId) {
      if (activeSceneId !== 'gas-power' || !sceneActivationId) return undefined;
      return {
        sceneId: 'gas-power',
        sceneNodeId: 'scene-node.gas-turbine',
        sceneActivationId,
      };
    }

    /** 统一从受控三字段载荷发送选择，正常、旧实例与延迟回归均复用同一协议路径。 */
    function postGasObjectSelection(sceneActivationId) {
      const payload = createGasObjectSelectionPayload(sceneActivationId);
      if (!payload) return false;
      post('objectSelected', payload);
      return true;
    }

    /** 精确 Origin 是唯一允许的父页面地址；路径、查询和片段都会拒绝启动通信。 */
    function isExactOrigin(value) {
      try {
        const url = new URL(value);
        return ['http:', 'https:'].includes(url.protocol) && url.origin === value;
      } catch {
        return false;
      }
    }

    /** 动作夹具只验证稳定标识和固定四态，不保留任何模拟层级、材质或路径对象。 */
    function isIdentifier(value) {
      return typeof value === 'string' && value.length > 0 && value.length <= 128;
    }

    /** 夹具与正式协议共用四态集合，未知值必须明确失败而非作为任意渲染参数继续传递。 */
    function isVisualState(value) {
      return ['normal', 'alarm', 'fault', 'offline'].includes(value);
    }

    /**
     * 只为三层夹具稳定复现“Unity 单节点失败但外层二维成功”。
     * 参数先经过既有四态白名单收敛，且只能精确匹配当前命令的视觉状态；它不影响载荷结构校验、
     * 场景选择、正式构建或其他四态命令，避免测试开关变成任意失败注入入口。
     */
    function shouldFailNodeVisualState(payload) {
      return isVisualState(failedNodeVisualState) && payload?.visualState === failedNodeVisualState;
    }

    /** 状态时间必须与正式内层协议一致：有界且可解析，避免夹具放宽契约而掩盖迟到状态问题。 */
    function isStatusUpdatedAt(value) {
      return typeof value === 'string' && value.length > 0 && value.length <= 128 && Number.isFinite(Date.parse(value));
    }

    /** 对每种受控动作执行最小结构校验；真实节点、流程和路径是否存在仍由 Unity 场景控制器负责。 */
    function isValidActionPayload(type, payload) {
      if (type === 'enterProcessStep') {
        return isIdentifier(payload?.processId) && isIdentifier(payload?.stepId) &&
          (payload?.unitId === undefined || isIdentifier(payload.unitId)) && typeof payload?.isolate === 'boolean';
      }
      // 命名镜头定位只能携带唯一稳定标识；夹具与正式协议同样拒绝坐标、旋转和额外字段。
      if (type === 'moveCameraToPose') {
        return Object.keys(payload ?? {}).length === 1 && isIdentifier(payload?.cameraPoseId);
      }
      // 与正式 Unity 桥接一致：聚焦必须携带 selectionId（选择标识），本地夹具不接受旧载荷静默降级。
      if (type === 'focusNode') {
        return isIdentifier(payload?.sceneNodeId) && isIdentifier(payload?.selectionId) && typeof payload?.isolate === 'boolean';
      }
      if (type === 'setNodeVisualState') {
        // 只有壳内正快照序号参与迟到隔离；平台时间和来源修订继续严格校验但只作诊断。
        const hasValidSnapshotSequence = Number.isSafeInteger(payload?.snapshotSequence) && payload.snapshotSequence > 0;
        const hasValidSourceRevision = Number.isSafeInteger(payload?.sourceRevision) && payload.sourceRevision >= 0;
        return isIdentifier(payload?.sceneNodeId) && isVisualState(payload?.visualState) &&
          isStatusUpdatedAt(payload?.statusUpdatedAt) && hasValidSnapshotSequence && hasValidSourceRevision;
      }
      // 关键环节准备和兼容进入携带完整目录定位；提交、取消准备和退出只使用已准备候选的稳定标识。
      if (type === 'prepareProcessDetail' || type === 'enterProcessDetail') {
        return isIdentifier(payload?.sceneId) && isIdentifier(payload?.processId) && isIdentifier(payload?.stepId) &&
          isIdentifier(payload?.processDetailId) && isIdentifier(payload?.transitionId);
      }
      if (type === 'commitProcessDetail' || type === 'abortProcessDetail' || type === 'exitProcessDetail') {
        return isIdentifier(payload?.sceneId) && isIdentifier(payload?.processDetailId) && isIdentifier(payload?.transitionId);
      }
      // 播放状态是独立受控命令，不从设备视觉状态或第三层事务阶段推导。
      if (type === 'setProcessDetailPlayback') {
        return isIdentifier(payload?.sceneId) && isIdentifier(payload?.processDetailId) && typeof payload?.playing === 'boolean';
      }
      // 清除动态状态必须携带与设置命令相同的受控三维节点标识和正整数本地快照序号。
      // 缺少该分支会让夹具错误宣称支持清除能力，却在完整快照设备消失时拒绝合法命令。
      if (type === 'clearNodeVisualState') {
        return isIdentifier(payload?.sceneNodeId) && Number.isSafeInteger(payload?.snapshotSequence) && payload.snapshotSequence > 0;
      }
      if (type === 'setRouteFlow') return isIdentifier(payload?.routeId) && typeof payload?.enabled === 'boolean';
      if (type === 'setNodeVisibility') return isIdentifier(payload?.sceneNodeId) && typeof payload?.enabled === 'boolean';
      // resetScene（场景重置）与 clearSelection（清除选择）均使用空对象载荷，
      // 但模拟页仍按不同命令类型返回结果，确保正式链路不会用场景重置冒充描边取消。
      return type === 'resetScene' || type === 'clearSelection';
    }

    /**
     * 仅为三层回归返回可预测的最终完成延迟：风电用于快速取代，光伏用于超过外层十秒总超时。
     * 非法、负数或过长延迟一律回退默认值，避免测试查询参数成为无界计时器来源。
     */
    function getSceneCompletionDelay(sceneId) {
      const candidate = sceneId === timeoutDelaySceneId
        ? timeoutSceneDelayMs
        : sceneId === fastDelaySceneId
          ? fastSceneDelayMs
          : 40;
      return Number.isFinite(candidate) && candidate >= 0 && candidate <= 15_000 ? candidate : 40;
    }

    /** 所有回传事件都使用精确父页面来源，且在释放后停止发送。 */
    function post(type, payload = {}) {
      if (disposed || !isExactOrigin(parentOrigin) || window.parent === window) return;
      window.parent.postMessage({ channel, version, instanceId, messageId: `${Date.now()}-${crypto.randomUUID()}`, type, payload, timestamp: Date.now() }, parentOrigin);
    }

    /** 父页面命令只允许白名单类型，未知类型不会影响模拟场景。 */
    function receive(event) {
      const data = event.data;
      if (disposed || event.origin !== parentOrigin || event.source !== window.parent) return;
      if (!data || data.channel !== channel || data.version !== version || data.instanceId !== instanceId || !commandCapabilities.includes(data.type)) return;

      if (data.type === 'init') {
        message.textContent = '初始化确认完成。';
        post('ack', { requestId: data.messageId, success: true, message: '模拟运行时已初始化。' });
      } else if (data.type === 'resize') {
        message.textContent = `已同步尺寸：${data.payload?.width || 0} × ${data.payload?.height || 0}`;
        post('commandResult', { requestId: data.messageId, success: true, message: '尺寸已同步。' });
      } else if (['enterProcessStep', 'moveCameraToPose', 'enterProcessDetail', 'prepareProcessDetail', 'commitProcessDetail', 'abortProcessDetail', 'exitProcessDetail', 'setProcessDetailPlayback', 'resetScene', 'focusNode', 'clearSelection', 'setNodeVisualState', 'clearNodeVisualState', 'setRouteFlow', 'setNodeVisibility'].includes(data.type)) {
        if (!isValidActionPayload(data.type, data.payload)) {
          post('commandResult', { requestId: data.messageId, success: false, errorCode: 'action-payload-invalid', message: '动作载荷缺少合法稳定标识或固定状态。' });
          return;
        }
        // 测试页仅显示已确认的固定命令类型，便于浏览器回归区分“同场景动作”与 switchScene；不记录任何载荷或对象信息。
        // focusNode 另以受限数字计数，供任务-028验证同一二维选择的幂等性，计数不会进入跨窗口协议。
        if (data.type === 'focusNode') {
          message.dataset.focusNodeCount = String(Number(message.dataset.focusNodeCount || '0') + 1);
        }
        if (data.type === 'setNodeVisualState') {
          if (shouldFailNodeVisualState(data.payload)) {
            // 保留固定计数而不保存节点标识或完整载荷；浏览器只据此核验模拟端确实拒绝过一次受控命令。
            message.dataset.nodeVisualStateFailureCount = String(Number(message.dataset.nodeVisualStateFailureCount || '0') + 1);
            message.textContent = '模拟运行时已拒绝受控节点视觉状态。';
            post('commandResult', {
              requestId: data.messageId,
              success: false,
              errorCode: 'scene-node-visual-state-simulated-failure',
              message: '模拟节点视觉状态失败。',
            });
            return;
          }
          // 只接受已经通过协议校验的四态和节点标识；相同节点更新为最新状态，不按批次无界累积。
          activeVisualStateBySceneNodeId.set(data.payload.sceneNodeId, data.payload.visualState);
          while (activeVisualStateBySceneNodeId.size > 500) activeVisualStateBySceneNodeId.delete(activeVisualStateBySceneNodeId.keys().next().value);
          message.dataset.nodeVisualStateCommandCount = String(Number(message.dataset.nodeVisualStateCommandCount || '0') + 1);
          message.dataset.lastNodeVisualState = data.payload.visualState;
          refreshVisualStateDiagnostics();
        }
        if (data.type === 'clearNodeVisualState') {
          // 清除恢复模型基础视觉，因此必须移除动态覆盖，而不能伪装成 normal（正常）状态。
          // 最近一次“设置”四态保持不变，便于三层回归同时核验故障已经下发与另一节点已被清除；
          // 该受限诊断不保存节点标识或业务载荷，也不会进入正式 WebGL 页面。
          activeVisualStateBySceneNodeId.delete(data.payload.sceneNodeId);
          message.dataset.clearNodeVisualStateCommandCount = String(Number(message.dataset.clearNodeVisualStateCommandCount || '0') + 1);
          refreshVisualStateDiagnostics();
        }
        message.textContent = `模拟运行时已确认 ${data.type}。`;
        post('commandResult', { requestId: data.messageId, success: true, message: `模拟运行时已确认 ${data.type}。` });
      } else if (data.type === 'switchScene') {
        const payload = data.payload || {};
        if (!payload.sceneId || !payload.transitionId || payload.sceneMappingVersion !== sceneMappingVersion || typeof payload.forceReload !== 'boolean') {
          // 测试页只显示固定失败阶段，不回显完整命令或查询参数，便于三层夹具判断是否在最终完成事件前失败。
          message.textContent = '场景切换载荷未通过受控映射版本校验。';
          post('commandResult', { requestId: data.messageId, success: false, errorCode: 'scene-switch-payload-invalid', message: '场景切换载荷无效。' });
          return;
        }
        // 先确认已接收原请求，再异步上报有限进度与最终成功事件，模拟 Unity 协调器的真实顺序。
        message.textContent = '场景切换请求已确认，正在等待最终完成事件。';
        post('ack', { requestId: data.messageId, success: true, message: '模拟运行时已接收场景切换。' });
        const completionDelay = getSceneCompletionDelay(payload.sceneId);
        window.setTimeout(() => post('sceneLoadProgress', {
          requestId: data.messageId,
          sceneId: payload.sceneId,
          transitionId: payload.transitionId,
          stageCode: 'loading-scene',
          progress: 0.5
        }), 20);
        window.setTimeout(() => {
          // 内层协议规定 sceneChanged 只能表示成功；失败必须通过关联原 requestId 的 commandResult 回传受控错误码。
          if (payload.sceneId === failedSceneId) {
            post('commandResult', { requestId: data.messageId, success: false, errorCode: 'scene-switch-simulated-failure', message: '模拟场景切换失败。' });
            return;
          }
          // 只有场景最终成功提交后才生成实例标识，不能用下行 transitionId 或页面时间戳冒充实例。
          if (disposed) return;
          if (activeSceneId && activeSceneActivationId) {
            rememberPreviousSceneActivation(activeSceneId, activeSceneActivationId);
          }
          activeSceneId = payload.sceneId;
          activeSceneActivationId = `scene-activation.local-${++sceneActivationSequence}`;
          post('sceneChanged', {
            requestId: data.messageId,
            sceneId: payload.sceneId,
            transitionId: payload.transitionId,
            sceneActivationId: activeSceneActivationId,
            success: true,
            sceneState: `模拟场景 ${payload.sceneId} 已就绪。`
          });
        }, completionDelay);
        // 仅在最终结果已排队后更新测试提示；它不参与协议校验或业务状态判断。
        window.setTimeout(() => {
          message.textContent = payload.sceneId === failedSceneId ? '场景切换最终失败事件已发送。' : '场景切换最终完成事件已发送。';
        }, completionDelay);
      } else if (data.type === 'dispose') {
        post('disposed', { requestId: data.messageId, success: true, message: '模拟运行时已释放。' });
        disposed = true;
        clearDelayedObjectSelectionTimers();
        previousSceneActivationIdBySceneId.clear();
        window.removeEventListener('message', receive);
        message.textContent = '运行时已释放。';
      }
    }

    if (!isExactOrigin(parentOrigin) || !instanceId || !runtimeKey || !buildId || !sceneMappingVersion || !resourceDigest) {
      message.textContent = '缺少精确父页面来源或运行时元数据，通信已禁用。';
    } else {
      window.addEventListener('message', receive);
      post('ready', { runtimeKey, buildId, sceneMappingVersion, protocolVersion: version, resourceDigest, commandCapabilities, eventCapabilities });
    }

    /**
     * 模拟 Unity 场景对象选中，只发送本地任务-037清单已经显式登记的三维节点和物理场景实例标识。
     * 它不代表正式燃气映射，更不会回传引擎对象引用、对象名称、层级或坐标。
     */
    document.querySelector('#object-button').addEventListener('click', () => {
      // 协议明确区分二维 nodeId、三维 sceneNodeId 与物理场景实例；夹具只回传当前已登记的受控标识。
      postGasObjectSelection(activeSceneActivationId);
    });

    /**
     * 仅在“燃气实例一 → 其他场景 → 燃气实例二”完成后发送燃气实例一的选择。
     * 该按钮模拟网络或引擎回调迟到，外层必须因 sceneActivationId（物理场景激活标识）不匹配而静默阻断。
     */
    document.querySelector('#stale-object-button').addEventListener('click', () => {
      postGasObjectSelection(previousSceneActivationIdBySceneId.get('gas-power'));
    });

    /**
     * 此按钮先捕获当前合法三字段载荷，再延迟发送。若期间收到 system.dispose（系统释放），
     * 释放分支会取消计时器；浏览器回归据此验证已释放实例不会继续产生外层对象选择事件。
     */
    document.querySelector('#delayed-object-button').addEventListener('click', () => {
      const payload = createGasObjectSelectionPayload(activeSceneActivationId);
      if (!payload || delayedObjectSelectionTimers.size > 0) return;
      const timerId = window.setTimeout(() => {
        delayedObjectSelectionTimers.delete(timerId);
        post('objectSelected', payload);
      }, delayedObjectSelectionDelayMs);
      delayedObjectSelectionTimers.add(timerId);
    });
  </script>
</body>
</html>
