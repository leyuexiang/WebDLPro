<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>任务-014三层通信测试宿主</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #e2e8f0; font: 14px/1.5 system-ui, sans-serif; background: #0f172a; }
    main { position: relative; min-block-size: 100vh; }
    /* 控制栏覆盖在测试页上方而不参与布局分栏，使 iframe 在 1280×720 回归中获得完整部署视口。 */
    aside { position: absolute; z-index: 2; inset-block: 0; inset-inline-start: 0; inline-size: 300px; padding: 20px; overflow: auto; background: rgb(17 28 50 / 96%); border-inline-end: 1px solid #334155; }
    h1 { margin: 0 0 12px; font-size: 19px; } p { margin: 8px 0; }
    button { inline-size: 100%; margin-block: 4px; padding: 9px; color: #082f49; font: inherit; font-weight: 700; cursor: pointer; background: #7dd3fc; border: 0; border-radius: 4px; }
    button.secondary { color: #dbeafe; background: #334155; }
    .hint { color: #94a3b8; font-size: 12px; }
    iframe { display: block; inline-size: 100%; block-size: 100vh; border: 0; background: #061323; }
    #logs { margin: 0; padding: 12px; max-block-size: 330px; overflow: auto; color: #cbd5e1; white-space: pre-wrap; background: #020617; border-block-start: 1px solid #334155; }
    @media (max-width: 760px) { aside { inline-size: min(300px, 88vw); border-inline-end: 1px solid #334155; } }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>任务-014三层通信测试</h1>
      <p id="result">正在等待可视化子应用就绪。</p>
      <button id="run-button">执行基础三层回归</button>
      <button id="advanced-run-button">执行超时与恢复回归</button>
      <button id="object-selection-regression-button">准备三维反向选择回归</button>
      <button id="workflow-button">触发同场景流程动作</button>
      <button id="cross-scene-workflow-button">触发跨场景流程动作</button>
      <button id="device-state-button">发送合成节点状态</button>
      <button id="device-snapshot-regression-button">执行连续完整快照回归</button>
      <button id="device-state-boundary-regression-button">执行状态边界三层回归</button>
      <button id="device-state-retry-regression-button">执行状态单在途重试回归</button>
      <button id="state-button">查询有限状态快照</button>
      <button id="dispose-button" class="secondary">释放子应用</button>
      <p class="hint">链路：本宿主页 → 正式嵌入壳 → Unity 模拟页。</p>
      <p class="hint">测试清单仅验证九场景闭集和燃气双击协议，不代表正式业务映射。</p>
      <pre id="logs" aria-live="polite"></pre>
    </aside>
    <!--
      该夹具模拟平台直接嵌入我方独立服务。原生全屏权限不会自动跨 iframe 继承；若宿主不显式授权，
      三维和拓扑组件的 requestFullscreen() 都会被浏览器拒绝，无法验证正式包要求的整屏展示。
      同时保留现代权限策略和兼容属性，使测试条件与平台接入说明一致，不影响消息来源或会话校验。
    -->
    <iframe id="shell-frame" title="可视化子应用测试实例" allow="fullscreen" allowfullscreen></iframe>
  </main>

  <script type="module">
    import { LocalShellDeviceStateRetryController } from './device-state-retry-controller.js';

    /**
     * 此页是外层父页面测试夹具，只通过 power-scene-topology-shell（外层协议通道）与嵌入壳通信。
     * 它不向 Unity 模拟页直发消息、不读取 iframe 内部状态，也不接受未校验的来源、窗口、实例或会话。
     */
    // 5173 已可能被用户的常驻开发服务占用；夹具固定使用独立 5174，避免重启或污染现有进程。
    const shellOrigin = 'http://127.0.0.1:5174';
    const channel = 'power-scene-topology-shell';
    const version = 1;
    const frame = document.querySelector('#shell-frame');
    const result = document.querySelector('#result');
    const logs = document.querySelector('#logs');
    const instanceId = `local-shell-${crypto.randomUUID()}`;
    let sessionId = '';
    let sequence = 0;
    // 仅用于本地夹具强制 iframe 发生一次真实导航；不参与外层协议身份、会话或业务载荷。
    // 释放后的壳地址若完全不变，浏览器会保留原页面，导致没有新 system.ready 可供建立新会话。
    let localShellGeneration = 0;
    let initialized = false;
    // 保存本页主动发送的初始化命令标识，只用于验证 system.ack 与首个 view.changed 都归属同一父命令。
    let initializationRequestId;
    /**
     * 仅缓存固定数量的事件摘要，供本地自动回归等待关联事件。
     * 不保存完整 payload（载荷）、异常文本或 Unity 对象，避免测试页成为不可信消息的旁路存储。
     */
    const observedEvents = [];
    // 只在“状态单在途重试回归”期间存在。它属于测试宿主页，不能进入嵌入壳或平台交付包。
    let stateRetryController;
    let ignoredStateRetryReplyTo;

    /** 日志限制为 80 行，只记录事件类型、受控标识和固定结果，不保存完整载荷。 */
    function writeLog(text) {
      logs.textContent = [`[${new Date().toLocaleTimeString()}] ${text}`, ...logs.textContent.split('\n').filter(Boolean)].slice(0, 80).join('\n');
    }

    /** 发送前必须已从 system.ready 获得当前会话；每个命令使用递增稳定标识，响应可精确关联。 */
    function postCommand(type, payload) {
      if (!sessionId || !frame.contentWindow) return undefined;
      const messageId = `host-command-${++sequence}`;
      frame.contentWindow.postMessage({
        channel,
        version,
        instanceId,
        sessionId,
        messageId,
        type,
        timestamp: Date.now(),
        payload,
      }, shellOrigin);
      writeLog(`已发送 ${type}：${messageId}`);
      return messageId;
    }

    /** 只生成清单中固定的“场景 + 默认拓扑”组合，测试页不接受标题、路径或任意坐标作为切换依据。 */
    function postViewOpen(sceneId) {
      return postCommand('view.open', { sceneId, topologyId: `topology.${sceneId}.overview` });
    }

    /**
     * 仅为本地夹具提供受限等待，不读取子应用或 Unity 模拟页的内部对象。
     * 每次等待固定在 150 毫秒以上，使当前浏览器动画帧、连接器确认和模拟 Unity 回执都有机会完成；
     * 它不是生产重试、平台轮询或状态超时策略，正式命令的十秒截止仍由嵌入壳协议生命周期统一管理。
     */
    function waitForLocalStateDelivery() {
      return new Promise((resolve) => window.setTimeout(resolve, 180));
    }

    /**
     * 等待已收集的受控事件摘要。超时仅用于测试页显示失败，不会修改嵌入壳、Unity 或外层协议状态。
     */
    function waitForEvent(predicate, timeoutMessage, timeoutMs = 4000, startIndex = 0) {
      // 重新创建内嵌壳后，旧会话残留的受控事件仍可保留在有限日志中；等待新会话时必须从指定下标开始查找，
      // 防止旧 system.ack 或 command.result 被误认作新实例的确认。这只约束本地夹具，不改变正式协议去重规则。
      const findEvent = () => observedEvents.slice(startIndex).find(predicate);
      const existing = findEvent();
      if (existing) return Promise.resolve(existing);

      return new Promise((resolve, reject) => {
        const deadline = Date.now() + timeoutMs;
        const timer = window.setInterval(() => {
          const event = findEvent();
          if (event) {
            window.clearInterval(timer);
            resolve(event);
            return;
          }
          if (Date.now() >= deadline) {
            window.clearInterval(timer);
            reject(new Error(timeoutMessage));
          }
        }, 30);
      });
    }

    /** 等待期间确认不存在错误会话的响应；旧会话若得到任何回包即表示隔离失效。 */
    function expectNoReply(replyTo, timeoutMessage) {
      return new Promise((resolve, reject) => {
        const deadline = Date.now() + 500;
        const timer = window.setInterval(() => {
          if (observedEvents.some((event) => event.replyTo === replyTo)) {
            window.clearInterval(timer);
            reject(new Error(timeoutMessage));
            return;
          }
          if (Date.now() >= deadline) {
            window.clearInterval(timer);
            resolve();
          }
        }, 30);
      });
    }

    /** 等待符合谓词的事件达到指定数量，供测试页验证单次回执与事件不重复派生。 */
    function waitForEventCount(predicate, expectedCount, timeoutMessage) {
      return new Promise((resolve, reject) => {
        const deadline = Date.now() + 4000;
        const timer = window.setInterval(() => {
          if (observedEvents.filter(predicate).length >= expectedCount) {
            window.clearInterval(timer);
            resolve();
            return;
          }
          if (Date.now() >= deadline) {
            window.clearInterval(timer);
            reject(new Error(timeoutMessage));
          }
        }, 30);
      });
    }

    /**
     * 从同源但非当前父窗口的隐藏 iframe 发送一条完整消息。
     * 该夹具刻意保留正确 Origin（来源）、实例与会话，只伪造 `event.source`（消息源窗口），
     * 用于验证 HostBridge（外层桥）不会把“同源”错误地等同于“当前父页面”。
     */
    async function sendForgedSourceCommand(message) {
      const attacker = document.createElement('iframe');
      const token = `forged-source-dispatched-${++sequence}`;
      attacker.hidden = true;
      attacker.srcdoc = '<script>window.addEventListener("message", function (event) { parent.document.querySelector("#shell-frame").contentWindow.postMessage(event.data.message, event.data.targetOrigin); parent.postMessage({ channel: "local-shell-regression", type: "forged-source-dispatched", token: event.data.token }, event.data.parentOrigin); });<\/script>';
      document.body.append(attacker);
      await new Promise((resolve) => attacker.addEventListener('load', resolve, { once: true }));
      await new Promise((resolve, reject) => {
        const timer = window.setTimeout(() => {
          window.removeEventListener('message', onConfirmation);
          reject(new Error('伪造来源夹具未完成消息转发。'));
        }, 2000);
        function onConfirmation(event) {
          if (event.source !== attacker.contentWindow || event.origin !== window.location.origin) return;
          if (event.data?.channel !== 'local-shell-regression' || event.data?.type !== 'forged-source-dispatched' || event.data?.token !== token) return;
          window.clearTimeout(timer);
          window.removeEventListener('message', onConfirmation);
          resolve();
        }
        window.addEventListener('message', onConfirmation);
        attacker.contentWindow.postMessage({ message, targetOrigin: shellOrigin, parentOrigin: window.location.origin, token }, window.location.origin);
      });
      attacker.remove();
    }

    /** 初始化与普通命令共用精确的当前实例/会话，禁止标题、路径或任意 Unity 方法名进入外层消息。 */
    function initialize() {
      initializationRequestId = postCommand('system.init', {
        sceneId: 'gas-power',
        topologyId: 'topology.gas-power.overview',
        expectedManifestVersion: 'local-shell-regression.1',
      });
    }

    /**
     * 生产 `system.dispose`（系统释放）会关闭当前握手和命令路由，这是不可逆的正确语义。
     * 本地夹具为让多个独立回归按钮可连续操作，才重新加载整个内嵌壳并等待新的 `system.init`；
     * 它不会向已释放会话发送重启命令，也不会出现在生产构建、平台清单或 Unity WebGL 包中。
     */
    async function recreateLocalShellAfterDispose() {
      const eventStartIndex = observedEvents.length;
      initialized = false;
      sessionId = '';
      initializationRequestId = undefined;
      // 维持受控实例标识不变，仅递增夹具地址的无业务代次，确保浏览器销毁已释放的 iframe 文档后重新加载嵌入壳。
      localShellGeneration += 1;
      frame.src = createShellUrl();

      await waitForEvent(
        (event) => event.type === 'system.ack'
          && event.replyTo === initializationRequestId
          && event.success === true,
        '重新加载后的 system.init 未完成。',
        5_000,
        eventStartIndex,
      );
    }

    /**
     * 正常场景不重载，避免覆盖正在进行的真实回归；只有前一轮已释放运行时时才创建新 iframe 会话。
     * 该门槛使测试页始终遵守“已释放子应用拒绝业务命令”的生产约束，而非伪造一次重新初始化。
     */
    async function ensureLocalShellReady() {
      if (initialized) return;
      await recreateLocalShellAfterDispose();
    }

    window.addEventListener('message', (event) => {
      const message = event.data;
      if (event.origin !== shellOrigin || event.source !== frame.contentWindow) return;
      if (!message || message.channel !== channel || message.version !== version || message.instanceId !== instanceId) return;
      if (typeof message.sessionId !== 'string' || typeof message.type !== 'string') return;

      /*
       * 自动回归只保留事件类型、关联标识、稳定场景/拓扑标识及受控结果码；不保存完整载荷、
       * 原始异常或 Unity 对象。数组上限保证重复测试不会积累内存。
       */
      const payload = message.payload && typeof message.payload === 'object' ? message.payload : {};
      const context = payload.context && typeof payload.context === 'object' ? payload.context : {};
      observedEvents.push({
        type: message.type,
        replyTo: message.replyTo,
        sessionId: message.sessionId,
        sceneId: typeof payload.sceneId === 'string' ? payload.sceneId : typeof context.sceneId === 'string' ? context.sceneId : undefined,
        topologyId: typeof payload.topologyId === 'string' ? payload.topologyId : typeof context.topologyId === 'string' ? context.topologyId : undefined,
        success: typeof payload.success === 'boolean' ? payload.success : undefined,
        status: typeof payload.status === 'string' ? payload.status : undefined,
        errorCode: payload.error && typeof payload.error === 'object' && typeof payload.error.code === 'string' ? payload.error.code : undefined,
      });
      if (observedEvents.length > 120) observedEvents.shift();

      if (message.type === 'system.ready') {
        sessionId = message.sessionId;
        writeLog('已收到 system.ready，开始 system.init。');
        initialize();
        return;
      }

      if (message.type === 'system.ack') {
        initialized = message.payload?.success === true;
        result.textContent = initialized ? '初始化已确认，稳定视图等待事件验证。' : '初始化被拒绝。';
        // 失败时只记录协议错误码，不回显完整载荷、内部异常或 Unity 层级信息。
        writeLog(`system.ack：${initialized ? '成功' : `失败（${message.payload?.error?.code ?? '未知错误码'}）`}，关联 ${message.replyTo ?? '缺失'}`);
        return;
      }

      if (message.type === 'view.changed') {
        result.textContent = `三层初始化通过：${message.payload.sceneId} / ${message.payload.topologyId}。`;
        writeLog(`view.changed：版本 ${message.payload.contextRevision}，关联 ${message.replyTo ?? '缺失'}`);
        return;
      }

      if (message.type === 'state.snapshot') {
        writeLog(`state.snapshot：Unity ${message.payload.unityStatus}，拓扑 ${message.payload.topologyStatus}，关联 ${message.replyTo ?? '缺失'}`);
        return;
      }

      if (message.type === 'topology.node.dblclick') {
        writeLog(`topology.node.dblclick：节点 ${message.payload.nodeId}`);
        return;
      }

      // 任务-037回归只展示清单映射后的节点标识；不显示 Unity 原始对象、节点名称或完整载荷。
      if (message.type === 'scene.object.selected') {
        writeLog(`scene.object.selected：节点 ${message.payload.nodeId ?? '未映射'}`);
        return;
      }

      if (message.type === 'command.result') {
        writeLog(`command.result：${message.payload.status}，关联 ${message.replyTo ?? '缺失'}`);
        if (message.payload.status === 'disposed') {
          // 释放结果必须优先终止当前会话，即使它并不关联节点状态命令，也不能遗留轮询或十秒计时器。
          stateRetryController?.handleCommandResult(message.replyTo, message.payload);
          initialized = false;
          stateRetryController = undefined;
          ignoredStateRetryReplyTo = undefined;
          return;
        }
        if (stateRetryController?.isAwaiting(message.replyTo)) {
          if (message.replyTo === ignoredStateRetryReplyTo) {
            // 仅在受控回归中模拟父页面丢失首个确认；嵌入壳仍已真实返回结果，不能据此改变生产命令语义。
            writeLog('状态重试回归：已按计划忽略首个命令确认。');
          } else {
            // 已消费的状态结果由控制器判别可恢复性；不可恢复失败会阻断相同状态内容的再次发送。
            stateRetryController.handleCommandResult(message.replyTo, message.payload);
          }
        }
      }
    });

    document.querySelector('#state-button').addEventListener('click', () => {
      if (!initialized) return writeLog('初始化尚未完成，拒绝发送状态查询。');
      postCommand('state.get', {});
    });

    /**
     * 任务-038三层回归的固定测试批次。
     * 此处只使用本地测试清单已登记的两个燃气节点及其静态三维映射，验证“宿主→嵌入壳→Unity模拟页”的状态链路；
     * 它不是平台真实设备数据，也不会被生产构建或正式清单复用。
     */
    document.querySelector('#device-state-button').addEventListener('click', () => {
      if (!initialized) return writeLog('初始化尚未完成，拒绝发送节点状态。');
      postCommand('device.states.update', {
        sourceRevision: Date.now(),
        // 必须与本地结构清单的受控稳定节点标识一致，避免状态回归绕过 nodeId 唯一性和引用门禁。
        items: [{ nodeId: 'node.gas-turbine', deviceStatus: 'alarm', statusUpdatedAt: new Date().toISOString() }],
      });
    });

    /**
     * 任务-038与任务-050的本地连续完整快照入口。
     * 两批均为“完整节点表”而非增量：先让两个节点进入告警，再以较小来源修订号仅保留燃机节点故障。
     * 第二批省略的发电机节点必须恢复二维基础状态并清除三维动态覆盖；协议仍拒绝空数组，符合正式通道
     * “没有节点状态时不发送空数组”的约束。每批只确认一次外层 `command.result`（命令结果），证明二维提交的唯一成功边界；
     * 三维命令到达和清除效果由内置浏览器读取真实 iframe 层级的受限可视提示验证，避免测试宿主页跨层读取或伪造 Unity 回执。
     */
    document.querySelector('#device-snapshot-regression-button').addEventListener('click', () => {
      void (async () => {
        await ensureLocalShellReady();
        result.textContent = '连续完整快照回归执行中。';
        const initialTimestamp = '2026-08-14T00:00:00.000Z';

        const alarmRequestId = postCommand('device.states.update', {
          sourceRevision: 300,
          // 首份完整表覆盖夹具内全部两个节点；不是平台设备绑定表，也不是为后续节点省略构造的增量补丁。
          items: [
            { nodeId: 'node.gas-turbine', deviceStatus: 'alarm', statusUpdatedAt: initialTimestamp },
            { nodeId: 'node.gas-generator', deviceStatus: 'alarm', statusUpdatedAt: initialTimestamp },
          ],
        });
        if (!alarmRequestId) throw new Error('告警完整快照未能发送。');
        const alarmResult = await waitForEvent(
          (event) => event.type === 'command.result' && event.replyTo === alarmRequestId,
          '告警完整快照未收到关联结果。',
        );
        if (alarmResult.success !== true || alarmResult.status !== 'completed') throw new Error('告警完整快照未按二维边界成功。');
        await waitForLocalStateDelivery();

        const replacementRequestId = postCommand('device.states.update', {
          // 合作方当前契约规定后到合法快照按到达顺序整体替换，较小来源修订仅作诊断，不能阻止燃机故障覆盖。
          sourceRevision: 1,
          // 发电机节点未出现在新的非空完整表中：二维必须清除其覆盖，三维必须下发独立清除命令。
          items: [{ nodeId: 'node.gas-turbine', deviceStatus: 'fault', statusUpdatedAt: '2026-08-13T00:00:00.000Z' }],
        });
        if (!replacementRequestId) throw new Error('替换完整快照未能发送。');
        const replacementResult = await waitForEvent(
          (event) => event.type === 'command.result' && event.replyTo === replacementRequestId,
          '替换完整快照未收到关联结果。',
        );
        if (replacementResult.success !== true || replacementResult.status !== 'completed') throw new Error('替换完整快照未按二维边界成功。');
        await waitForLocalStateDelivery();

        result.textContent = '连续完整快照已确认：双节点告警、较小来源修订下燃机节点故障和缺失节点清除均只返回一次二维成功。';
        writeLog('连续完整快照回归已完成，等待内置浏览器核验三维命令和二维基础状态恢复。');
      })().catch((error) => {
        // 测试页只显示本页构造的固定失败摘要，不泄露嵌入壳、Unity 模拟页或外层协议的原始载荷。
        result.textContent = `连续完整快照回归失败：${error instanceof Error ? error.message : '未知测试错误。'}`;
        writeLog('连续完整快照回归失败。');
      });
    });

    /**
     * 为状态边界回归创建干净会话。
     * 完整快照的“缺失即清除”语义会受上一轮测试留下的权威状态影响，因此该回归不能复用未知状态的
     * 已初始化 iframe。这里先走正式的 system.dispose（系统释放）并等待唯一释放回执，再重建整个
     * 本地嵌入壳；不向已释放会话发送任何业务命令，也不把此测试便利逻辑带入生产入口。
     */
    async function restartLocalShellForStateBoundaryRegression() {
      const eventStartIndex = observedEvents.length;
      if (initialized) {
        const disposeRequestId = postCommand('system.dispose', { reason: 'local-shell-state-boundary-regression' });
        if (!disposeRequestId) throw new Error('状态边界回归未能发送释放命令。');
        await waitForEvent(
          (event) => event.type === 'command.result' && event.replyTo === disposeRequestId && event.status === 'disposed',
          '状态边界回归未收到关联释放确认。',
          5_000,
          eventStartIndex,
        );
      }

      const rebuiltEventStartIndex = observedEvents.length;
      await recreateLocalShellAfterDispose();
      if (!initializationRequestId) throw new Error('状态边界回归重建后缺少初始化关联标识。');
      await waitForEvent(
        (event) => event.type === 'view.changed'
          && event.replyTo === initializationRequestId
          && event.sceneId === 'gas-power'
          && event.topologyId === 'topology.gas-power.overview',
        '状态边界回归重建后未提交燃气稳定视图。',
        5_000,
        rebuiltEventStartIndex,
      );
    }

    /**
     * 任务-014剩余状态边界的真实三层回归。
     * 1. 单条合法完整快照内重复出现同一节点时，最后一项必须覆盖前一项；
     * 2. 保存后的完整快照在“燃气 → 风电 → 燃气”后必须由当前壳重投影，无需父页面重推；
     * 3. 本地 Unity 模拟页仅拒绝 offline（离线）状态，以验证三维异步失败不会撤销或重复二维成功。
     *
     * 外层宿主页只断言可公开观察的唯一 command.result（命令结果）与稳定视图。模拟页实际拒绝和
     * 重投影到达由内置浏览器读取其受限诊断属性核验，避免把 Unity 内部失败原因扩展到正式外层协议。
     */
    document.querySelector('#device-state-boundary-regression-button').addEventListener('click', () => {
      void (async () => {
        result.textContent = '状态边界三层回归执行中。';
        await restartLocalShellForStateBoundaryRegression();

        const duplicateRequestId = postCommand('device.states.update', {
          sourceRevision: 80,
          items: [
            { nodeId: 'node.gas-turbine', deviceStatus: 'alarm', statusUpdatedAt: '2026-08-14T01:00:00.000Z' },
            // 同一完整表内的后项必须覆盖前项；不得将首项缓存为增量状态或生成两次三维设置命令。
            { nodeId: 'node.gas-turbine', deviceStatus: 'fault', statusUpdatedAt: '2026-08-14T01:00:01.000Z' },
          ],
        });
        if (!duplicateRequestId) throw new Error('重复节点完整快照未能发送。');
        const duplicateResult = await waitForEvent(
          (event) => event.type === 'command.result' && event.replyTo === duplicateRequestId,
          '重复节点完整快照未收到关联结果。',
        );
        if (duplicateResult.success !== true || duplicateResult.status !== 'completed') {
          throw new Error('同批重复节点未按二维提交边界完成。');
        }
        await new Promise((resolve) => window.setTimeout(resolve, 500));
        if (observedEvents.filter((event) => event.type === 'command.result' && event.replyTo === duplicateRequestId).length !== 1) {
          throw new Error('同批重复节点不应产生第二份外层成功回执。');
        }
        await waitForLocalStateDelivery();

        const windRequestId = postViewOpen('wind-power');
        if (!windRequestId) throw new Error('跨场景重投影未能发送风电切换。');
        await waitForEvent(
          (event) => event.type === 'view.changed' && event.replyTo === windRequestId && event.sceneId === 'wind-power',
          '跨场景重投影未提交风电稳定视图。',
        );
        const gasRequestId = postViewOpen('gas-power');
        if (!gasRequestId) throw new Error('跨场景重投影未能发送燃气返回。');
        await waitForEvent(
          (event) => event.type === 'view.changed' && event.replyTo === gasRequestId && event.sceneId === 'gas-power',
          '跨场景重投影未在返回燃气后提交稳定视图。',
        );
        await waitForLocalStateDelivery();

        const failedUnityRequestId = postCommand('device.states.update', {
          sourceRevision: 81,
          // 本地模拟页由专用启动参数拒绝 offline；正式运行时不会读取该参数或伪造状态失败。
          items: [{ nodeId: 'node.gas-turbine', deviceStatus: 'offline', statusUpdatedAt: '2026-08-14T01:00:02.000Z' }],
        });
        if (!failedUnityRequestId) throw new Error('三维失败隔离快照未能发送。');
        const failedUnityResult = await waitForEvent(
          (event) => event.type === 'command.result' && event.replyTo === failedUnityRequestId,
          '三维失败隔离快照未收到关联结果。',
        );
        if (failedUnityResult.success !== true || failedUnityResult.status !== 'completed') {
          throw new Error('三维失败不应改变二维成功回执。');
        }
        await new Promise((resolve) => window.setTimeout(resolve, 500));
        if (observedEvents.filter((event) => event.type === 'command.result' && event.replyTo === failedUnityRequestId).length !== 1) {
          throw new Error('三维失败隔离快照不应重复外层成功回执。');
        }
        await waitForLocalStateDelivery();

        result.textContent = '状态边界三层回归通过：同批最后项、跨场景重投影与三维失败二维成功均已确认。';
        writeLog('状态边界三层回归通过，等待内置浏览器核验模拟页受限诊断。');
      })().catch((error) => {
        // 夹具只显示自己定义的固定阶段摘要，不能把 iframe 内部错误或协议载荷回显到父页面。
        result.textContent = `状态边界三层回归失败：${error instanceof Error ? error.message : '未知测试错误。'}`;
        writeLog('状态边界三层回归失败。');
      });
    });

    /**
     * 任务-014的父页面单在途契约回归。
     * 首轮发送后故意不消费它的命令结果，模拟父页面在跨窗口链路上丢失确认；五秒后更新“数据源”的
     * 最新完整快照，十秒截止释放在途槽位后再由下一轮检查读取新快照并生成新 messageId。此过程不改写
     * 嵌入壳的十秒生命周期，也不会把本地轮询代码编入平台发布包。
     */
    document.querySelector('#device-state-retry-regression-button').addEventListener('click', () => {
      void (async () => {
        await ensureLocalShellReady();
        stateRetryController?.stop();
        const retryAttempts = [];
        let skippedCount = 0;
        let timeoutCount = 0;
        let latestSnapshot = {
          sourceRevision: 300,
          items: [
            { nodeId: 'node.gas-turbine', deviceStatus: 'alarm', statusUpdatedAt: '2026-08-14T00:00:00.000Z' },
            { nodeId: 'node.gas-generator', deviceStatus: 'alarm', statusUpdatedAt: '2026-08-14T00:00:00.000Z' },
          ],
        };
        ignoredStateRetryReplyTo = undefined;
        result.textContent = '状态单在途重试回归执行中，约需十五秒。';
        // 每次回归保存自己的控制器引用。收到 system.dispose 后全局控制器会被释放；异步断言必须
        // 识别这种正常取消，不能把“没有继续重试”误报为十秒超时失败。
        const retryController = new LocalShellDeviceStateRetryController({
          // 每轮发送前重新读取变量，而不是缓存首轮对象，确保超时后的命令使用数据源当时的最新完整表。
          readLatestSnapshot: () => latestSnapshot,
          sendSnapshot: (snapshot) => postCommand('device.states.update', {
            sourceRevision: snapshot.sourceRevision,
            items: snapshot.items.map((item) => ({ ...item })),
          }),
          onAttempt: ({ messageId, snapshot }) => {
            retryAttempts.push({ messageId, sourceRevision: snapshot.sourceRevision });
            if (retryAttempts.length === 1) ignoredStateRetryReplyTo = messageId;
            writeLog(`状态重试回归：第${retryAttempts.length}次发送 ${messageId}。`);
          },
          onSkipped: () => { skippedCount += 1; },
          onTimeout: () => { timeoutCount += 1; },
        });
        stateRetryController = retryController;
        retryController.start();

        // 首个五秒检查仍在等待首轮确认；随后只改数据源快照，不能立刻越过在途槽位发送第二条命令。
        await new Promise((resolve) => window.setTimeout(resolve, 5_200));
        if (stateRetryController !== retryController) {
          result.textContent = '状态单在途重试已随系统释放停止。';
          writeLog('状态重试回归已因系统释放正常停止。');
          return;
        }
        latestSnapshot = {
          sourceRevision: 1,
          items: [{ nodeId: 'node.gas-turbine', deviceStatus: 'fault', statusUpdatedAt: '2026-08-13T00:00:00.000Z' }],
        };
        writeLog('状态重试回归：已更新待重试的最新完整快照。');

        const retryWaitResult = await new Promise((resolve, reject) => {
          const deadline = Date.now() + 12_000;
          const timer = window.setInterval(() => {
            // 释放会销毁当前控制器。此处先结束本轮回归，确保已清理的会话不会继续等待或报错。
            if (stateRetryController !== retryController) {
              window.clearInterval(timer);
              resolve('disposed');
              return;
            }
            if (retryAttempts.length >= 2) {
              window.clearInterval(timer);
              resolve('retried');
              return;
            }
            if (Date.now() >= deadline) {
              window.clearInterval(timer);
              reject(new Error('十秒超时后未以新标识发送最新完整快照。'));
            }
          }, 30);
        });
        if (retryWaitResult === 'disposed') {
          result.textContent = '状态单在途重试已随系统释放停止。';
          writeLog('状态重试回归已因系统释放正常停止。');
          return;
        }

        const [firstAttempt, retryAttempt] = retryAttempts;
        if (
          !firstAttempt || !retryAttempt
          || firstAttempt.messageId === retryAttempt.messageId
          || firstAttempt.sourceRevision !== 300
          || retryAttempt.sourceRevision !== 1
          || skippedCount < 1
          || timeoutCount !== 1
        ) throw new Error('状态单在途、十秒超时或最新快照重读断言失败。');

        const retryResult = await waitForEvent(
          (event) => event.type === 'command.result' && event.replyTo === retryAttempt.messageId,
          '新标识重试未收到关联命令结果。',
        );
        if (retryResult.success !== true || retryResult.status !== 'completed') throw new Error('新标识重试未按二维提交边界成功。');

        retryController.stop();
        if (stateRetryController === retryController) stateRetryController = undefined;
        ignoredStateRetryReplyTo = undefined;
        result.textContent = '状态单在途重试已确认：五秒跳过、十秒超时、最新快照重读与新标识回执均通过。';
        writeLog('状态重试回归已完成。');
      })().catch((error) => {
        stateRetryController?.stop();
        stateRetryController = undefined;
        ignoredStateRetryReplyTo = undefined;
        result.textContent = `状态单在途重试回归失败：${error instanceof Error ? error.message : '未知测试错误。'}`;
        writeLog('状态重试回归失败。');
      });
    });
    document.querySelector('#dispose-button').addEventListener('click', () => {
      if (!initialized) return writeLog('初始化尚未完成，拒绝发送释放命令。');
      postCommand('system.dispose', { reason: 'local-shell-regression' });
    });

    /**
     * 本地夹具动作只对应清单中的 `action.gas.reset`，用于任务-034验证。
     * 它会从燃气总览切至空的燃气明细拓扑，但不携带参数、不接受页面输入，也不代表正式燃气流程或节点映射。
     */
    document.querySelector('#workflow-button').addEventListener('click', () => {
      if (!initialized) return writeLog('初始化尚未完成，拒绝发送流程动作。');
      postCommand('workflow.trigger', { actionId: 'action.gas.reset' });
    });

    /** 合成风电重置动作专门验证任务-035的跨场景路径；目标由清单限定，页面不能传入场景名称或拓扑名称。 */
    document.querySelector('#cross-scene-workflow-button').addEventListener('click', () => {
      if (!initialized) return writeLog('初始化尚未完成，拒绝发送跨场景流程动作。');
      postCommand('workflow.trigger', { actionId: 'action.wind.reset' });

    /**
     * 任务-037的浏览器准备步骤只通过外层 view.open（原子打开视图）创建“燃气实例一 → 风电 → 燃气实例二”。
     * 宿主页不向 Unity 模拟页直接发消息，也不读取其内部激活标识；后续旧实例、当前实例和延迟选择均由
     * 浏览器点击模拟页可见按钮产生，确保验证仍穿过正式嵌入壳的来源、会话和协议门禁。

    document.querySelector('#object-selection-regression-button').addEventListener('click', () => {
      void (async () => {

        result.textContent = '三维反向选择回归准备中：正在切换燃气 → 风电 → 燃气。';

        await waitForEvent(

            && event.sceneId === 'gas-power' && event.topologyId === 'topology.gas-power.overview',

        result.textContent = '三维反向选择回归已准备：请依次测试旧实例、当前实例和释放后延迟事件。';
        writeLog('任务-037：已形成燃气实例一 → 风电 → 燃气实例二。');
      })().catch((error) => {
        // 只输出本夹具主动构造的固定阶段说明，不泄露嵌入壳、Unity 模拟页或完整外层消息。
        result.textContent = `三维反向选择回归准备失败：${error instanceof Error ? error.message : '未知测试错误。'}`;
        writeLog('任务-037回归准备失败。');

    /** 用只读状态快照确认异常或被取代的事务没有覆盖上一个稳定燃气上下文。 */
    async function assertGasContext(description) {
      const stateRequestId = postCommand('state.get', {});
      if (!stateRequestId) throw new Error(`${description}：状态查询未能发送。`);
      const snapshot = await waitForEvent(
        (event) => event.type === 'state.snapshot' && event.replyTo === stateRequestId,
        `${description}：未收到关联状态快照。`,
      );
      if (snapshot.sceneId !== 'gas-power' || snapshot.topologyId !== 'topology.gas-power.overview') {
        throw new Error(`${description}：稳定上下文没有恢复为燃气场景。`);
      }
    }

    /**
     * 基础三层回归只覆盖可由外层宿主页真实触发的安全链路：状态查询关联、旧会话静默拒绝和释放确认。
     * Canvas 双击需要命中真实二维坐标，保留给浏览器自动化执行，避免本页伪造 `topology.node.dblclick` 事件。
     */
    document.querySelector('#run-button').addEventListener('click', () => {
      void (async () => {
        await ensureLocalShellReady();
        result.textContent = '基础三层回归执行中。';

        if (!initializationRequestId) throw new Error('初始化命令缺少可验证的关联标识。');
        await waitForEvent(
          (event) => event.type === 'view.changed' && event.replyTo === initializationRequestId,
          '初始化后的视图变更未按原 system.init 命令关联返回。',
        );

        const stateRequestId = postCommand('state.get', {});
        if (!stateRequestId) throw new Error('状态查询未能发送。');
        await waitForEvent((event) => event.type === 'state.snapshot' && event.replyTo === stateRequestId, '状态快照未按原请求关联返回。');
        await waitForEvent((event) => event.type === 'command.result' && event.replyTo === stateRequestId, '状态查询命令结果未按原请求关联返回。');

        const duplicateMessageId = `host-duplicate-state-${++sequence}`;
        const duplicateMessage = {
          channel,
          version,
          instanceId,
          sessionId,
          messageId: duplicateMessageId,
          type: 'state.get',
          timestamp: Date.now(),
          payload: {},
        };
        // 两次发送严格复用同一 messageId；当前协议要求重复命令静默丢弃，绝不能重放第二份业务回执或状态快照。
        frame.contentWindow.postMessage(duplicateMessage, shellOrigin);
        frame.contentWindow.postMessage(duplicateMessage, shellOrigin);
        await waitForEvent((event) => event.type === 'command.result' && event.replyTo === duplicateMessageId, '首个重复标识命令未得到关联结果。');
        await new Promise((resolve) => window.setTimeout(resolve, 600));
        if (observedEvents.filter((event) => event.type === 'command.result' && event.replyTo === duplicateMessageId).length !== 1) {
          throw new Error('重复消息不应发送第二份命令结果。');
        }
        if (observedEvents.filter((event) => event.type === 'state.snapshot' && event.replyTo === duplicateMessageId).length !== 1) {
          throw new Error('重复消息不应重复派生状态快照。');
        }

        const staleMessageId = `host-stale-session-${++sequence}`;
        frame.contentWindow.postMessage({
          channel,
          version,
          instanceId,
          sessionId: 'old-session-local-01',
          messageId: staleMessageId,
          type: 'state.get',
          timestamp: Date.now(),
          payload: {},
        }, shellOrigin);
        await expectNoReply(staleMessageId, '旧会话命令不应得到外层响应。');

        const forgedSourceMessageId = `host-forged-source-${++sequence}`;
        await sendForgedSourceCommand({
          channel,
          version,
          instanceId,
          sessionId,
          messageId: forgedSourceMessageId,
          type: 'state.get',
          timestamp: Date.now(),
          payload: {},
        });
        await expectNoReply(forgedSourceMessageId, '同源但非当前父窗口的命令不应得到外层响应。');

        const disposeRequestId = postCommand('system.dispose', { reason: 'local-shell-auto-regression' });
        if (!disposeRequestId) throw new Error('释放命令未能发送。');
        await waitForEvent((event) => event.type === 'command.result' && event.replyTo === disposeRequestId, '释放命令未收到关联确认。');
        result.textContent = '基础三层回归通过：查询关联、旧会话拒绝、伪造来源拒绝与释放确认正常。';
        writeLog('基础三层回归通过。');
      })().catch((error) => {
        // 仅显示本测试页主动构造的固定失败说明；不回显 iframe 事件、原始异常或完整命令。
        result.textContent = `基础三层回归失败：${error instanceof Error ? error.message : '未知测试错误。'}`;
        writeLog('基础三层回归失败。');
      });
    });

    /**
     * 高阶三层回归使用 Unity 模拟页的三类受控最终结果：风电短延迟、光伏超时延迟和配电失败回执。
     * 每步都用新的固定清单目标触发真实 `view.open`，并只从外层回包及状态快照断言，不直接读取子 iframe。
     */
    document.querySelector('#advanced-run-button').addEventListener('click', () => {
      void (async () => {
        await ensureLocalShellReady();
        result.textContent = '超时与恢复三层回归执行中。';

        const fastStartIndex = observedEvents.length;
        const windRequestId = postViewOpen('wind-power');
        if (!windRequestId) throw new Error('连续取代的首个请求未能发送。');
        // 两条同目标短延迟切换各自拥有独立事务；最后燃气请求必须同时取代它们，验证连续三条命令只提交最后一次。
        await new Promise((resolve) => window.setTimeout(resolve, 40));
        const windReplacementId = postViewOpen('wind-power');
        if (!windReplacementId) throw new Error('连续取代的第二个请求未能发送。');
        await new Promise((resolve) => window.setTimeout(resolve, 40));
        const fastRecoveryId = postViewOpen('gas-power');
        if (!fastRecoveryId) throw new Error('连续取代的最终恢复请求未能发送。');
        const fastRecovery = await waitForEvent(
          (event) => event.type === 'command.result' && event.replyTo === fastRecoveryId,
          '快速取代的恢复命令未得到关联结果。',
        );
        const windResult = await waitForEvent(
          (event) => event.type === 'command.result' && event.replyTo === windRequestId,
          '首个被取代的风电命令未得到关联结果。',
        );
        const windReplacementResult = await waitForEvent(
          (event) => event.type === 'command.result' && event.replyTo === windReplacementId,
          '第二个被取代的风电命令未得到关联结果。',
        );
        if (
          fastRecovery.success !== true || fastRecovery.status !== 'completed'
          || windResult.status !== 'superseded' || windResult.errorCode !== 'command.superseded'
          || windReplacementResult.status !== 'superseded' || windReplacementResult.errorCode !== 'command.superseded'
        ) {
          throw new Error('连续三次切换未保持“最后事务成功、前两事务已取代”的结果语义。');
        }
        if (observedEvents.slice(fastStartIndex).some((event) => event.type === 'view.changed' && event.sceneId === 'wind-power')) {
          throw new Error('被取代的风电事务不应发布稳定视图。');
        }
        await assertGasContext('连续三次取代后');

        const failedRequestId = postViewOpen('distribution');
        if (!failedRequestId) throw new Error('异常恢复的失败请求未能发送。');
        const failedResult = await waitForEvent(
          (event) => event.type === 'command.result' && event.replyTo === failedRequestId,
          '模拟失败场景未得到关联结果。',
        );
        if (failedResult.success !== false || failedResult.errorCode !== 'scene.switch.failed') {
          throw new Error('场景最终失败未收敛为受控场景切换错误。');
        }
        await assertGasContext('场景失败后');

        const timeoutRequestId = postViewOpen('solar-power');
        if (!timeoutRequestId) throw new Error('超时场景请求未能发送。');
        const timeoutResult = await waitForEvent(
          (event) => event.type === 'command.result' && event.replyTo === timeoutRequestId,
          '十秒外层命令超时未得到关联结果。',
          12_000,
        );
        if (timeoutResult.success !== false || timeoutResult.errorCode !== 'command.timeout') {
          throw new Error('延迟场景未按十秒总上限返回受控超时。');
        }

        /*
         * 此处刻意不发送任何后续 view.open（打开视图）命令。
         * 任务-036要求超时本身撤销旧事务并启动受控补偿恢复；若立刻再发燃气命令，
         * 只能证明“新命令取代旧命令”，会掩盖“超时后迟到 Unity 成功仍可提交”的根因。
         * 光伏最终事件在十秒超时后约一秒抵达，等待两秒可同时观察补偿完成与迟到回调隔离。
         */
        await new Promise((resolve) => window.setTimeout(resolve, 2_000));
        if (observedEvents.slice(fastStartIndex).some((event) => event.type === 'view.changed' && event.sceneId === 'solar-power')) {
          throw new Error('超时后的光伏迟到回调不应发布稳定视图。');
        }
        await assertGasContext('光伏迟到完成后');

        const disposeRequestId = postCommand('system.dispose', { reason: 'local-shell-advanced-regression' });
        if (!disposeRequestId) throw new Error('高阶回归释放命令未能发送。');
        await waitForEvent((event) => event.type === 'command.result' && event.replyTo === disposeRequestId, '高阶回归释放命令未收到关联确认。');
        result.textContent = '超时与恢复三层回归通过：连续三次取代、失败恢复、超时自主补偿、迟到回调隔离与释放确认正常。';
        writeLog('超时与恢复三层回归通过。');
      })().catch((error) => {
        // 只显示本测试页预设的失败摘要，避免将来自 iframe 的任意异常或载荷回显到页面。
        result.textContent = `超时与恢复三层回归失败：${error instanceof Error ? error.message : '未知测试错误。'}`;
        writeLog('超时与恢复三层回归失败。');
      });
    });

    /**
     * 监听器先于 iframe 地址设置，保证嵌入壳的 ready 事件不会因快速加载丢失。
     * 每次重建复用同一受控实例标识，避免测试夹具借由任意实例标识绕过正式来源、窗口和会话校验。
     */
    function createShellUrl() {
      const shellUrl = new URL(`${shellOrigin}/`);
      shellUrl.searchParams.set('parentOrigin', window.location.origin);
      shellUrl.searchParams.set('instanceId', instanceId);
      shellUrl.searchParams.set('protocolVersion', String(version));
      // 嵌入壳忽略此测试专用参数；它只保证释放后的本地夹具不会把相同 src 误判为无需重载。
      shellUrl.searchParams.set('localShellGeneration', String(localShellGeneration));
      return shellUrl.toString();
    }

    frame.src = createShellUrl();
  </script>
</body>
</html>
